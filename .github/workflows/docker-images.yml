# Compila las imágenes Docker para linux/arm64 (VPS Oracle) y linux/amd64 y las publica en GHCR:
#   ghcr.io/<owner>/estudiantes-api, estudiantes-frontend, estudiantes-scraper
# Etiquetas: latest + sha-<commit corto> (el stack usa IMAGE_TAG=sha-<commit corto>).
# OJO: los paquetes de GHCR nacen PRIVADOS; hágalos públicos una vez (ver README). Cada arquitectura se compila de forma nativa
# (ubuntu-24.04-arm gratuito para repos públicos) y luego se unen en un manifiesto multi-arch.
name: Imágenes Docker

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-images-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: ${{ matrix.image }} (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        image: [api, frontend, scraper]
        arch: [arm64, amd64]
        include:
          - arch: arm64
            runner: ubuntu-24.04-arm
          - arch: amd64
            runner: ubuntu-24.04
          - image: api
            context: backend
            dockerfile: backend/Dockerfile
          - image: frontend
            context: frontend
            dockerfile: frontend/Dockerfile
          - image: scraper
            context: .
            dockerfile: scraper/Dockerfile
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Nombre de la imagen (minúsculas)
        run: echo "IMAGE=${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/estudiantes-${{ matrix.image }}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compilar y publicar por digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/${{ matrix.arch }}
          # Sólo el nombre visible (público). Ningún secreto se incrusta en la imagen.
          build-args: |
            NEXT_PUBLIC_APP_NAME=${{ vars.APP_NAME || 'Estudiantes' }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.arch }}

      - name: Guardar digest
        run: |
          mkdir -p /tmp/digests
          d="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${d#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.image }}-${{ matrix.arch }}
          path: /tmp/digests/*
          retention-days: 1

  merge:
    name: manifiesto ${{ matrix.image }}
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        image: [api, frontend, scraper]
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digests-${{ matrix.image }}-*
          merge-multiple: true
          path: /tmp/digests

      - name: Nombre de la imagen y etiquetas
        run: |
          echo "IMAGE=${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/estudiantes-${{ matrix.image }}" >> "$GITHUB_ENV"
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Crear manifiesto multi-arquitectura (latest + sha-<corto>)
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            -t "${IMAGE}:latest" -t "${IMAGE}:sha-${SHORT_SHA}" \
            $(printf "${IMAGE}@sha256:%s " *)

      - name: Verificar
        run: docker buildx imagetools inspect "${IMAGE}:sha-${SHORT_SHA}"
